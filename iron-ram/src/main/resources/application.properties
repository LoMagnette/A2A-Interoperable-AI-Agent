quarkus.langchain4j.ollama.chat-model.model-id=gemma4
quarkus.http.port=8080
quarkus.langchain4j.ollama.chat-model.temperature=0.0
quarkus.langchain4j.ollama.timeout=120s
quarkus.langchain4j.ollama.log-requests=true
quarkus.langchain4j.ollama.log-responses=true

# Workaround for quarkiverse/quarkus-langchain4j#2340 on Quarkus 3.35.x:
# registry-client.*.connect-timeout/read-timeout @WithDefault references
# ${quarkus.langchain4j.timeout}; if unset, SmallRye resolves it to "false"
# and Duration conversion fails at startup.
quarkus.langchain4j.timeout=60s

quarkus.langchain4j.mcp.garage.transport-type=streamable-http
quarkus.langchain4j.mcp.garage.url=http://localhost:8082/mcp
quarkus.langchain4j.mcp.garage.log-requests=true
quarkus.langchain4j.mcp.garage.log-responses=true
